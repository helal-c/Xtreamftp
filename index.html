<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xtream Smart TV Portal</title>

    <!-- ================= PWA Meta Tags ================= -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#facc15">
    <link rel="apple-touch-icon" href="./js/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="application-name" content="Xtream TV">
    
    <!-- আপনার আলাদা কোনো CSS ফাইল থাকলে এখানে লিংক করুন -->
    <!-- <link rel="stylesheet" href="css/style.css"> -->

    <style>
        /* বেসিক স্টাইল (আপনার আসল ডিজাইন দিয়ে এটি পরিবর্তন করে নিতে পারবেন) */
        body {
            background-color: #070a12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .logo {
            width: 150px;
            height: 150px;
            border-radius: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(250, 204, 21, 0.2);
            object-fit: cover;
        }
        h1 {
            color: #facc15;
            font-size: 28px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        p {
            color: #a1a1aa;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- ================= আপনার ওয়েবসাইটের মূল ডিজাইন ================= -->
    <div class="container">
        <!-- লোগোটি js ফোল্ডারের ভেতরে logo.png নামে থাকতে হবে -->
        <img src="js/logo.png" alt="Xtream TV Logo" class="logo" onerror="this.src='https://via.placeholder.com/150x150?text=Logo'">
        
        <h1>Xtream Smart TV Portal</h1>
        <p>Movies, Series, and Live Channels</p>
        
        <!-- আপনার টিভির চ্যানেল লিস্ট বা ভিডিও প্লেয়ারের কোড এখানে বসাতে পারেন -->
    </div>
    <!-- ========================================================== -->


    <!-- আপনার আলাদা কোনো JS ফাইল থাকলে এখানে লিংক করুন -->
    <!-- <script src="js/main.js"></script> -->

    <!-- ================= PWA Service Worker Script (Install App এর জন্য) ================= -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').then(function(registration) {
                    console.log('ServiceWorker registered successfully!');
                }, function(err) {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>

</body>
</html>
